name: Bot Schedule (09:00-01:00 MSK = 16h/day)

# MSK = UTC+3, поэтому 09:00 MSK = 06:00 UTC, а 01:00 MSK = 22:00 UTC накануне.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Что сделать вручную
        required: true
        default: start
        type: choice
        options: [start, stop]

permissions:
  contents: read

env:
  RAILWAY_SERVICE: numbertree_bot

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Официального GitHub Action у Railway нет: раньше здесь стояло
      # `uses: railway/cli@v3`, но такого репозитория не существует (404),
      # поэтому шаг падал на резолве и расписание не срабатывало.
      # Штатный способ для CI — поставить CLI из npm.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # RAILWAY_TOKEN с токеном проекта не требует railway link.
      - name: Start Bot
        if: github.event.schedule == '0 6 * * *' || inputs.action == 'start'
        run: railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Без --yes CLI ждёт подтверждения в интерактивном режиме и висит до таймаута.
      - name: Stop Bot
        if: github.event.schedule == '0 22 * * *' || inputs.action == 'stop'
        run: railway down --service "$RAILWAY_SERVICE" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
